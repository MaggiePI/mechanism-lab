<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanism Lab</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8edf5;background:#101622}body{max-width:1100px;margin:36px auto;padding:0 22px}h1{font-size:2.3rem;letter-spacing:-.05em;margin-bottom:6px}p{color:#aab6c7}section{background:#192333;border:1px solid #2b3b50;border-radius:14px;padding:20px;margin:20px 0}label{display:inline-grid;gap:8px;margin:10px 16px 10px 0;color:#bdc9da}select,input,button{background:#101622;color:#e8edf5;border:1px solid #45556b;border-radius:8px;padding:10px}button{background:#3974d5;border:none;cursor:pointer;font-weight:600;margin:10px 8px 10px 0}button:hover{background:#4c8bef}canvas{width:100%;height:300px;background:#101622;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#c3d4ec}small{color:#98a9c0}
</style></head><body><h1>Mechanism Lab</h1><p>Test competing explanations of reward-based decisions. All results are synthetic, not biological or clinical predictions.</p><section><label>Generating model<select id="model"><option value="qlearning">Q-learning</option><option value="adaptive">Adaptive learning</option><option value="leaky">Leaky integrator</option><option value="random">Random</option></select></label><label>Trials<input id="trials" type="number" min="20" max="1000" value="160"></label><label>Reversal trial<input id="reversal" type="number" min="1" value="80"></label><label>Seed<input id="seed" type="number" value="42"></label><div><button onclick="run('simulate')">Simulate</button><button onclick="run('compare')">Compare models</button><button onclick="run('recover')">Parameter recovery</button><button onclick="run('intervene')">Intervention</button></div><small>Start the API with <code>uvicorn mechanism_lab.api:app --reload</code> and serve this page with <code>python -m http.server 8080 -d web</code>.</small></section><section><h2 id="heading">Simulation</h2><canvas id="chart" width="1000" height="300"></canvas><pre id="results">Choose an experiment above.</pre></section><script>
const $=id=>document.getElementById(id);let rows=[];
function draw(data){const c=$('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#33445a';for(let i=0;i<=4;i++){let y=20+i*65;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(980,y);ctx.stroke()}if(!data.length)return;const N=data.length,rx=Number($('reversal').value);ctx.setLineDash([5,5]);ctx.strokeStyle='#e9b76a';ctx.beginPath();let x=40+940*(rx-1)/Math.max(1,N-1);ctx.moveTo(x,20);ctx.lineTo(x,280);ctx.stroke();ctx.setLineDash([]);for(const [key,color] of [['p_choice1','#68a4ff'],['reward','#61d3ad']]){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();data.forEach((r,i)=>{let x=40+940*i/Math.max(1,N-1),y=280-260*r[key];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.fillStyle='#bdc9da';ctx.fillText('Blue: P(choice 1)   Green: reward   Dashed: reversal',45,14)}
async function run(action){$('heading').textContent=action[0].toUpperCase()+action.slice(1);$('results').textContent='Running…';const body={model:$('model').value,trials:Number($('trials').value),reversal:Number($('reversal').value),seed:Number($('seed').value)};try{const response=await fetch('http://localhost:8000/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(JSON.stringify(result));if(action==='simulate'){rows=result;draw(rows);const reward=rows.reduce((s,r)=>s+r.reward,0)/rows.length;$('results').textContent='Reward rate: '+reward.toFixed(3)+'\n'+JSON.stringify(rows.slice(0,12),null,2)+'\n…'}else{$('results').textContent=JSON.stringify(result,null,2);if(rows.length)draw(rows)}}catch(e){$('results').textContent='API unavailable or request failed: '+e.message}}
</script></body></html>
